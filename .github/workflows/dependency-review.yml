name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  dependency-review:
    # Gates the PR's dependency *diff* for newly introduced vulnerable packages
    # (DO-11). actions/dependency-review-action was dropped: it calls GitHub's
    # Dependency Review API, which private repos only get with GitHub Advanced
    # Security - the same wall that forced `upload: never` in codeql.yml.
    # OSV-Scanner reproduces the gate locally on the runner: it scans lockfiles
    # at the PR base and head and fails only on newly introduced vulnerabilities.
    # The full-tree high-severity audit remains CI's "Dependency Audit" job.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      # SARIF upload to Code Scanning also requires Advanced Security on private repos.
      upload-sarif: false
    permissions:
      actions: read
      contents: read
      security-events: write
