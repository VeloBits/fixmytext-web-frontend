name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The real dependency-review action gates the PR's dependency *diff* for
      # high/critical advisories and disallowed licenses (DO-11). The previous
      # `npm audit` step was a misnamed full-tree audit (already covered by the
      # CI "Dependency Audit" job). Renovate digest-pins the tag.
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
