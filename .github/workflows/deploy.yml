# Cloudflare deployment — runs the root `deploy:*` scripts in the order the
# Module Federation topology requires:
#
#   remotes (Pages) ─▶ shell (Pages, bakes prod remoteEntry URLs) ─▶ content (Worker)
#                                                                  └─▶ router worker (last)
#
# Why this order: the shell bakes VITE_*_REMOTE_ENTRY at build time, and the router
# worker proxies /remotes/* to the remote Pages projects. Deploying the remotes first
# guarantees the shell's baked URLs and the router resolve to freshly-deployed bundles.
#
# Required repo configuration:
#   secrets.CLOUDFLARE_API_TOKEN, secrets.CLOUDFLARE_ACCOUNT_ID   (wrangler reads these)
#   vars.VITE_EDITOR_REMOTE_ENTRY    = https://<prod-domain>/remotes/editor/remoteEntry.js
#   vars.VITE_ANALYTICS_REMOTE_ENTRY = https://<prod-domain>/remotes/analytics/remoteEntry.js
#   vars.VITE_API_URL, vars.VITE_KEYCLOAK_URL, vars.VITE_KEYCLOAK_CLIENT_ID  (+ Sentry as needed)
#   vars.VITE_GAMIFICATION_ENABLED (optional) — set to 'false' to turn gamification dark
#                                   in prod; unset/'true' keeps it enabled (default).
# (Confirm the CF Pages project names in package.json deploy:* scripts match your account.)
name: Deploy (Cloudflare)

# Deploy ONLY after the "Frontend CI" workflow completes successfully on main —
# never on a raw push. This gates lint/typecheck/tests/federation-smoke/npm-audit
# before anything reaches production (H-6). Manual re-deploys go through
# workflow_dispatch.
on:
  workflow_run:
    workflows: ['Frontend CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-remotes:
    name: Deploy remote (${{ matrix.remote }})
    runs-on: ubuntu-latest
    # Only run for a successful CI run or a manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        remote:
          - editor
          - analytics
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Deploy the exact commit that passed CI (workflow_run.head_sha);
          # fall back to the triggering ref for a manual dispatch.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build & deploy ${{ matrix.remote }}-remote to Cloudflare Pages
        run: npm run deploy:${{ matrix.remote }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Gamification kill switch (absent/true ⇒ enabled; 'false' ⇒ dark).
          # Defaults to 'true' so prod is unchanged until the repo var is set to 'false'.
          VITE_GAMIFICATION_ENABLED: ${{ vars.VITE_GAMIFICATION_ENABLED || 'true' }}

  deploy-shell:
    name: Deploy shell (host)
    runs-on: ubuntu-latest
    needs: deploy-remotes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Deploy the exact commit that passed CI (workflow_run.head_sha);
          # fall back to the triggering ref for a manual dispatch.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build & deploy shell to Cloudflare Pages
        run: npm run deploy:shell
        env:
          # Federation entry points baked into the host bundle — must point at the
          # production router so the browser loads each remote under /remotes/<name>/.
          VITE_EDITOR_REMOTE_ENTRY: ${{ vars.VITE_EDITOR_REMOTE_ENTRY }}
          VITE_ANALYTICS_REMOTE_ENTRY: ${{ vars.VITE_ANALYTICS_REMOTE_ENTRY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_KEYCLOAK_URL: ${{ vars.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ vars.VITE_KEYCLOAK_CLIENT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN_FRONTEND }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          # Gamification kill switch (absent/true ⇒ enabled; 'false' ⇒ dark).
          # Defaults to 'true' so prod is unchanged until the repo var is set to 'false'.
          VITE_GAMIFICATION_ENABLED: ${{ vars.VITE_GAMIFICATION_ENABLED || 'true' }}

  deploy-content:
    name: Deploy content (Worker / OpenNext)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Deploy the exact commit that passed CI (workflow_run.head_sha);
          # fall back to the triggering ref for a manual dispatch.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build & deploy content app
        run: npm run deploy:content
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.VITE_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

  deploy-router:
    name: Deploy router worker
    runs-on: ubuntu-latest
    # The router stitches the deployed units together — deploy it last so it never
    # routes to a unit that hasn't been published yet.
    needs: [deploy-remotes, deploy-shell, deploy-content]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Deploy the exact commit that passed CI (workflow_run.head_sha);
          # fall back to the triggering ref for a manual dispatch.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy @velobits/cf-router-worker
        run: npm run deploy:worker
