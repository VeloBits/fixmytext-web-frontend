# fixmytext-frontend — unified compose for all microfrontends.
#
# Profiles:
#   dev  — Vite dev servers + next dev (hot reload, volume-mounted source)
#   prod — Built nginx containers + wrangler pages dev (Cloudflare simulation)
#
# Usage:
#   docker compose --profile dev up --build
#   docker compose --profile prod up --build

services:
  # ── Router — dev ──────────────────────────────────────────────────────────────
  router:
    profiles: ['dev']
    build:
      context: .
      dockerfile: docker/Dockerfile.router
      args:
        NGINX_CONF: docker/nginx.router.dev.conf
    container_name: fixmytext-router
    ports:
      - '3000:80'
    depends_on:
      - shell-dev
      - editor-remote-dev
      - analytics-remote-dev
      - content-dev
    restart: unless-stopped

  # ── Router — prod ─────────────────────────────────────────────────────────────
  router-prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: docker/Dockerfile.router
      args:
        NGINX_CONF: docker/nginx.router.prod.conf
    container_name: fixmytext-router-prod
    ports:
      - '3000:80'
    depends_on:
      - shell-prod
      - editor-remote-prod
      - analytics-remote-prod
      - content-prod
    restart: unless-stopped

  # ── Shell — dev ────────────────────────────────────────────────────────────────
  shell-dev:
    profiles: ['dev']
    build:
      context: .
      dockerfile: docker/Dockerfile.vite.dev
      args:
        APP_WORKSPACE: '@velobits/shell'
    container_name: fixmytext-shell-dev
    ports:
      - '3100:3100'
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env.docker.dev
    restart: unless-stopped

  # ── Shell — prod ───────────────────────────────────────────────────────────────
  shell-prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: docker/Dockerfile.vite.prod
      args:
        APP_WORKSPACE: '@velobits/shell'
        APP_PATH: 'apps/shell'
        # Vite bakes these at BUILD time, so they must arrive as build args — the
        # `env_file` below is runtime-only (nginx) and cannot reach the build stage.
        # Defaults point at the local router (port 3000) for the prod simulation;
        # override via host env / a root `.env` for a real deployment.
        VITE_EDITOR_REMOTE_ENTRY: ${VITE_EDITOR_REMOTE_ENTRY:-http://localhost:3000/remotes/editor/remoteEntry.js}
        VITE_ANALYTICS_REMOTE_ENTRY: ${VITE_ANALYTICS_REMOTE_ENTRY:-http://localhost:3000/remotes/analytics/remoteEntry.js}
    container_name: fixmytext-shell-prod
    env_file: .env.docker.prod
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080']
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Editor Remote — dev ────────────────────────────────────────────────────────
  editor-remote-dev:
    profiles: ['dev']
    build:
      context: .
      dockerfile: docker/Dockerfile.vite.dev
      args:
        APP_WORKSPACE: '@velobits/editor-remote'
    container_name: fixmytext-editor-dev
    ports:
      - '3101:3101'
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env.docker.dev
    restart: unless-stopped

  # ── Editor Remote — prod ───────────────────────────────────────────────────────
  editor-remote-prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: docker/Dockerfile.vite.prod
      args:
        APP_WORKSPACE: '@velobits/editor-remote'
        APP_PATH: 'apps/editor-remote'
    container_name: fixmytext-editor-prod
    env_file: .env.docker.prod
    restart: unless-stopped

  # ── Analytics Remote — dev ─────────────────────────────────────────────────────
  analytics-remote-dev:
    profiles: ['dev']
    build:
      context: .
      dockerfile: docker/Dockerfile.vite.dev
      args:
        APP_WORKSPACE: '@velobits/analytics-remote'
    container_name: fixmytext-analytics-dev
    ports:
      - '3102:3102'
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env.docker.dev
    restart: unless-stopped

  # ── Analytics Remote — prod ────────────────────────────────────────────────────
  analytics-remote-prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: docker/Dockerfile.vite.prod
      args:
        APP_WORKSPACE: '@velobits/analytics-remote'
        APP_PATH: 'apps/analytics-remote'
    container_name: fixmytext-analytics-prod
    env_file: .env.docker.prod
    restart: unless-stopped

  # ── Content — dev ──────────────────────────────────────────────────────────────
  content-dev:
    profiles: ['dev']
    build:
      context: .
      dockerfile: docker/Dockerfile.content.dev
    container_name: fixmytext-content-dev
    ports:
      - '3103:3103'
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env.docker.dev
    environment:
      # Server-side fetches (apps/content/lib/api.ts) run inside this container,
      # where Kong's host-published 127.0.0.1:8000 is unreachable — talk to Kong
      # directly over the backend compose network instead. Requires the backend
      # stack to be up first (it owns the external network below).
      CONTENT_API_URL: http://kong:8000
    networks:
      - default
      - backend
    restart: unless-stopped

  # ── Content — prod ─────────────────────────────────────────────────────────────
  content-prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: docker/Dockerfile.content.prod
    container_name: fixmytext-content-prod
    env_file: .env.docker.prod
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3103']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# ── Networks ──────────────────────────────────────────────────────────────────
# The backend stack (backend/docker-compose.yml) owns this network; content-dev
# joins it so server-side rendering can reach Kong at http://kong:8000.
networks:
  backend:
    name: backend_fixmytext-net
    external: true
