upstream shell_upstream      { server shell-dev:3100; }
upstream editor_upstream     { server editor-remote-dev:3101; }
upstream analytics_upstream  { server analytics-remote-dev:3102; }
upstream content_upstream    { server content-dev:3103; }

# Dynamic rendering: crawlers/link-preview scrapers get the content app's SSR
# on the marketing/share paths, humans get the shell SPA. Mirrors BOT_UA in
# worker/src/index.ts — keep the two lists in sync.
map $http_user_agent $fmx_marketing_upstream {
    default shell_upstream;
    "~*googlebot|bingbot|slurp|duckduckbot|baiduspider|yandex|applebot|petalbot|facebookexternalhit|facebookcatalog|twitterbot|linkedinbot|slackbot|discordbot|telegrambot|whatsapp|pinterestbot|redditbot|embedly|quora link preview|outbrain|vkshare|w3c_validator" content_upstream;
}

server {
    listen 80;
    server_name _;
    # Relative Location headers — nginx listens on 80 inside the container but
    # is published on :3000, so absolute redirects would drop the host port.
    absolute_redirect off;

    location /remotes/editor/ {
        rewrite ^/remotes/editor/(.*)$ /$1 break;
        proxy_pass http://editor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /remotes/analytics/ {
        rewrite ^/remotes/analytics/(.*)$ /$1 break;
        proxy_pass http://analytics_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    # Legacy prefix: the shell used to live under /app — redirect old
    # bookmarks/share links to the root-based equivalents. The regex enforces
    # the segment boundary (/appfoo is not redirected) — mirrors worker/src/index.ts.
    location ~ ^/app(?:/(.*))?$ {
        return 301 /$1$is_args$args;
    }
    # Content app — always (the shell has no equivalent): SEO tool pages and
    # crawl artifacts. Mirrors isContentAlwaysPath in worker/src/index.ts.
    location ~ ^/(?:tools(?:/.*)?|sitemap\.xml|robots\.txt)$ {
        proxy_pass http://content_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Content app — bots only (dynamic rendering): the shell has in-app pages on
    # these paths for humans; crawlers need the SSR/OG versions. '/' excluded —
    # content's root page redirects to /app, which 301s back (a bot would loop).
    # Mirrors isContentBotPath in worker/src/index.ts.
    location ~ ^/(?:about|pricing|share/.*)$ {
        proxy_pass http://$fmx_marketing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Shell SPA owns the origin root — everything not matched above, for humans
    # and bots alike.
    location / {
        proxy_pass http://shell_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
