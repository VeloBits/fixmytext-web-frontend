upstream shell_upstream      { server shell-dev:3100; }
upstream editor_upstream     { server editor-remote-dev:3101; }
upstream analytics_upstream  { server analytics-remote-dev:3102; }
upstream content_upstream    { server content-dev:3103; }

server {
    listen 80;
    server_name _;

    location /remotes/editor/ {
        rewrite ^/remotes/editor/(.*)$ /$1 break;
        proxy_pass http://editor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /remotes/analytics/ {
        rewrite ^/remotes/analytics/(.*)$ /$1 break;
        proxy_pass http://analytics_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    # Exact + trailing-slash locations so /appfoo falls through to content
    # (segment boundary — mirrors worker/src/index.ts). No rewrite: the Vite
    # dev server serves under its '/app' base directly.
    location = /app {
        proxy_pass http://shell_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /app/ {
        proxy_pass http://shell_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://content_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
