upstream shell_upstream      { server shell-prod:8080; }
upstream editor_upstream     { server editor-remote-prod:8080; }
upstream analytics_upstream  { server analytics-remote-prod:8080; }
upstream content_upstream    { server content-prod:3103; }

server {
    listen 80;
    server_name _;

    location /remotes/editor/ {
        rewrite ^/remotes/editor/(.*)$ /$1 break;
        proxy_pass http://editor_upstream;
        proxy_set_header Host $host;
    }
    location /remotes/analytics/ {
        rewrite ^/remotes/analytics/(.*)$ /$1 break;
        proxy_pass http://analytics_upstream;
        proxy_set_header Host $host;
    }
    location /app {
        proxy_pass http://shell_upstream;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://content_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
