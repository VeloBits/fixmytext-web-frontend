upstream shell_upstream      { server shell-prod:8080; }
upstream editor_upstream     { server editor-remote-prod:8080; }
upstream analytics_upstream  { server analytics-remote-prod:8080; }
upstream content_upstream    { server content-prod:3103; }

server {
    listen 80;
    server_name _;

    # Security headers (FE-AUTH-06). Mirrors the Cloudflare router worker
    # (worker/src/index.ts) used in real prod. `always` emits headers on errors too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.velobits.dev https://*.ingest.sentry.io https://sentry.io https://*.razorpay.com; frame-src 'self' https://*.velobits.dev https://*.razorpay.com; form-action 'self' https://*.velobits.dev" always;

    location /remotes/editor/ {
        rewrite ^/remotes/editor/(.*)$ /$1 break;
        proxy_pass http://editor_upstream;
        proxy_set_header Host $host;
    }
    location /remotes/analytics/ {
        rewrite ^/remotes/analytics/(.*)$ /$1 break;
        proxy_pass http://analytics_upstream;
        proxy_set_header Host $host;
    }
    location /app {
        proxy_pass http://shell_upstream;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://content_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
